name: Python Distro Check

# Checks if:
#   - does C++ compile?
#   - do the C++ assertions hold?
#   - does a wheel built from this tree install and pass the Python suite?
on:
    push:
        branches: [ main, develop ]
    pull_request: # Every PR is checked

concurrency:
    group: distro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: build + test (ubuntu, py3.14)
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up Python 3.14
                uses: actions/setup-python@v7
                with:
                    python-version: '3.14'

            -   name: Install Python dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt

            # Release rather than the default empty build type, so the C++ tests
            # exercise optimized code -- the same configuration the shipped
            # wheels are built with
            -   name: Configure CMake
                run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)"

            # Only the C++ test target. Python module is built by the
            # wheel step below.
            -   name: Build C++ tests
                run: cmake --build build --target fastdist_tests --parallel

            # Current C++ tests have flakes (geometric, discrete uniform, and uniform)
            # Tracking: ghosteau/fastdist#2
            # Remove the --repeat once that issue is closed.
            -   name: Run C++ tests
                run: ctest --test-dir build --output-on-failure --repeat until-pass:3

            # Build isolation is left on so this also validates that
            # build-system.requires in pyproject.toml is complete.
            -   name: Build wheel
                run: python -m build --wheel

            -   name: Install wheel
                run: pip install dist/*.whl --force-reinstall

            -   name: Run Python tests
                run: pytest tests/python -q

            # Validates the stub
            #
            # --follow-imports=skip is required: without it mypy resolves the
            # file as fastdist._fastdist, pulls in the package __init__, and
            # type checks the whole wrapper layer
            -   name: Type check the extension stub
                run: mypy --follow-imports=skip python/fastdist/_fastdist.pyi

            # Regenerate against the freshly installed extension and compare.
            # Catches a binding added or renamed without updating the stub.
            -   name: Check the stub is up to date
                run: |
                    pybind11-stubgen fastdist._fastdist -o stub-check
                    python - <<'PY'
                    import sys
                    from pathlib import Path

                    marker = "from __future__ import annotations"
                    committed = Path("python/fastdist/_fastdist.pyi").read_text(encoding="utf-8")
                    generated = Path("stub-check/fastdist/_fastdist.pyi").read_text(encoding="utf-8")

                    committed = committed[committed.index(marker):]
                    generated = generated[generated.index(marker):]

                    if committed.strip() != generated.strip():
                        sys.exit(
                            "python/fastdist/_fastdist.pyi is out of date with the "
                            "bindings. Regenerate it, see the Type stubs section "
                            "in CONTRIBUTING.md."
                        )
                    print("stub matches the built extension")
                    PY

name: Python Distro Check

# Checks if:
#   - does C++ compile?
#   - do the C++ assertions hold?
#   - does a wheel built from this tree install and pass the Python suite?
on:
    push:
        branches: [ main, develop ]
    pull_request: # Every PR is checked

concurrency:
    group: distro-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    check:
        name: build + test (ubuntu, py3.14)
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up Python 3.14
                uses: actions/setup-python@v7
                with:
                    python-version: '3.14'

            -   name: Install Python dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt

            # Release rather than the default empty build type, so the C++ tests
            # exercise optimized code -- the same configuration the shipped
            # wheels are built with
            -   name: Configure CMake
                run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE="$(which python)"

            # Only the C++ test target. Python module is built by the
            # wheel step below.
            -   name: Build C++ tests
                run: cmake --build build --target fastdist_tests --parallel

            # RNG tolerances are sized from the estimator standard error (>=7 sigma),
            # so a failure here is a real regression rather than a flake.
            -   name: Run C++ tests
                run: ctest --test-dir build --output-on-failure

            # Build isolation is left on so this also validates that
            # build-system.requires in pyproject.toml is complete.
            -   name: Build wheel
                run: python -m build --wheel

            -   name: Install wheel
                run: pip install dist/*.whl --force-reinstall

            -   name: Run Python tests
                run: pytest tests/python -q

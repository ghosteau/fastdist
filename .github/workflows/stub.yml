name: Type Stub

# Regenerates python/fastdist/_fastdist.pyi from a CUDA-enabled build and fails
# if the committed file differs.
on:
    push:
        branches: [ main, develop ]
    pull_request:
        paths:
            - 'src/bindings/**'
            - 'src/wrappers/**'
            - 'include/fastdist/**'
            - 'python/fastdist/_fastdist.pyi'
            - 'CMakeLists.txt'
            - '.github/workflows/stub.yml'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    stub:
        name: stub matches a CUDA build
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout repository
                uses: actions/checkout@v7

            -   name: Set up Python
                uses: actions/setup-python@v7
                with:
                    python-version: '3.10'

            -   name: Install the CUDA toolkit
                uses: Jimver/cuda-toolkit@v0.2.36
                with:
                    method: network
                    sub-packages: '["nvcc", "cudart"]'

            -   name: Install Python dependencies
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt

            -   name: Build with CUDA enabled
                env:
                    FASTDIST_ENABLE_CUDA: '1'
                    CMAKE_ARGS: '-DCMAKE_CUDA_ARCHITECTURES=75'
                run: pip install . --no-build-isolation -v

            -   name: Confirm the CUDA bindings are present
                run: |
                    cd "$RUNNER_TEMP"
                    python -c "
                    import fastdist._fastdist as c
                    n = len([s for s in dir(c) if s.endswith('_cuda')])
                    print(f'{n} *_cuda symbols exposed')
                    assert n, 'CUDA build produced no *_cuda bindings; the stub would be wrong'
                    "

            -   name: Regenerate the stub
                run: pybind11-stubgen fastdist._fastdist -o stub-check

            -   name: Compare against the committed stub
                run: |
                    if diff -u python/fastdist/_fastdist.pyi stub-check/fastdist/_fastdist.pyi; then
                        echo "stub matches the CUDA build"
                    else
                        echo "::error::_fastdist.pyi does not match a CUDA build. Download the regenerated-stub artifact from this run and commit it."
                        exit 1
                    fi

            -   name: Upload the regenerated stub
                if: failure()
                uses: actions/upload-artifact@v7
                with:
                    name: regenerated-stub
                    path: stub-check/fastdist/_fastdist.pyi
                    if-no-files-found: error
